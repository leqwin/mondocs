<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} - {{ site.Title }}{{ end }}</title>
  <link rel="icon" type="image/png" href="{{ "favicon.png" | relURL }}">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/chroma.css" | relURL }}">
</head>
<body>
  <input type="checkbox" id="sidebar-state">
  <header id="topbar">
    <label for="sidebar-state" id="sidebar-toggle" aria-label="Toggle sidebar">&#9776;</label>
    <a href="{{ site.Home.RelPermalink }}" id="logo">
      <img src="{{ "logo.png" | relURL }}" alt="" class="topbar-logo"><span>{{ site.Title }}</span>
    </a>
    <nav id="nav">
      {{ $first := .FirstSection }}
      {{ range site.Home.Sections }}
      <a href="{{ .RelPermalink }}"{{ if eq $first . }} class="active"{{ end }}>{{ .Title }}</a>
      {{ end }}
    </nav>
  </header>
  <div id="layout">
    <aside id="sidebar">
      <nav>
        <ul class="tree">
          <li><a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} class="active"{{ end }}>{{ site.Home.Title }}</a></li>
          {{ partial "tree.html" (dict "section" site.Home "current" .) }}
        </ul>
      </nav>
    </aside>
    <main id="content">
      {{ block "main" . }}{{ end }}
    </main>
  </div>
  <footer id="footer">
    <span>documentation for monbooru and its addons</span>
    <span>AGPL-3.0-or-later</span>
  </footer>
  <script>
    addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      document.querySelectorAll('.lightbox-state:checked').forEach(function (c) { c.checked = false; });
    });
  </script>
</body>
</html>
